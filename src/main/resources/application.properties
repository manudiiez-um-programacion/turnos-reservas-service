spring.application.name=turnos-reservas-service

# Se resuelve al compilar: spring-boot-starter-parent filtra este archivo con
# delimitadores @...@, asi que la version del servicio sale del pom y no se duplica.
turnos.version=@project.version@

# ---------------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------------
# PostgreSQL: el enunciado rechaza H2, SQLite y cualquier embebida como
# almacenamiento principal. Credenciales por variables de entorno (#7); los
# defaults son solo para desarrollo local y no son secretos.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/turnos_reservas}
spring.datasource.username=${DB_USERNAME:turnos}
spring.datasource.password=${DB_PASSWORD:turnos}
# Hibernate avisa (HHH90000025) que este dialecto no haria falta declararlo.
# Es un falso positivo con la configuracion de abajo: al desactivar el acceso a
# los metadatos JDBC, Hibernate no puede deducirlo y sin esta linea el arranque
# falla con "Unable to determine Dialect without JDBC metadata". Verificado.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# El esquema lo manejan las migraciones versionadas (#6), nunca Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# PROVISIONAL (se elimina en #5/#6): permite arrancar el servicio sin PostgreSQL
# levantado. Hace falta porque el Docker Compose y las migraciones son del
# milestone siguiente y este milestone igual tiene que arrancar y pasar `verify`.
#
# Son dos cosas distintas: Hikari no aborta el arranque si el pool no puede
# crear conexiones, y Hibernate no consulta los metadatos JDBC al iniciar (por
# eso el dialecto de arriba se declara explicito). Sin la segunda, el arranque
# se cuelga ~30 s reintentando conectar.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# PROVISIONAL (se elimina en #10): sin un UserDetailsService propio, Spring
# Security crea un usuario en memoria con una password aleatoria y la escribe en
# el log. Los usuarios finales llegan en M4; hasta entonces no queremos esa
# credencial fantasma.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# Documentacion de la API
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
