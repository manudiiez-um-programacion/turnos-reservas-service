spring.application.name=turnos-reservas-service

# Se resuelve al compilar: spring-boot-starter-parent filtra este archivo con
# delimitadores @...@, asi que la version del servicio sale del pom y no se duplica.
turnos.version=@project.version@

# 8081 y no 8080: el servicio de catalogo ocupa el 8080 y los dos backends
# tienen que poder correr al mismo tiempo (#5).
server.port=${SERVER_PORT:8081}

# ---------------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------------
# PostgreSQL: el enunciado rechaza H2, SQLite y cualquier embebida como
# almacenamiento principal. Credenciales por variables de entorno; los
# defaults son solo para desarrollo local y no son secretos.
#
# El default apunta al PostgreSQL que publica Docker Compose en la maquina, que
# es el caso de correr la app con `./mvnw spring-boot:run` sin perfil. El
# perfil 'docker' lo sobrescribe, porque dentro de la red de compose la base se
# alcanza por el nombre del servicio y por el puerto interno. Ver
# application-local.properties y application-docker.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:turnos_reservas}}
spring.datasource.username=${DB_USERNAME:turnos}
spring.datasource.password=${DB_PASSWORD:turnos}

# El esquema lo manejan las migraciones versionadas, nunca Hibernate:
# 'validate' solo verifica que el mapeo de las entidades coincida con las
# tablas que crearon los scripts. Nunca 'update' ni 'create-drop', en ningun
# perfil. Mientras no haya entidades JPA, validate no tiene nada que verificar
# y es un no-op; el dia que las haya, avisa si el mapeo y la migracion se
# separaron.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Instantes en UTC del lado de JDBC: el contrato de la catedra usa ISO-8601 en
# UTC y las columnas son TIMESTAMPTZ. Fijarlo evita que el huso de la JVM se
# filtre en lo que se guarda.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Migraciones (Flyway)
# ---------------------------------------------------------------------------
# Corren solas al arrancar: Flyway aplica lo que falte y registra la version en
# flyway_schema_history, asi que un reinicio no vuelve a aplicar nada. Las
# migraciones se agregan, nunca se editan una vez mergeadas (el checksum deja
# de coincidir y validate-on-migrate falla, que es justamente la proteccion).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# La base arranca vacia: si aparecen tablas sin historial de Flyway es un
# error, y queremos que falle en vez de inventar una linea base.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Nunca, en ningun perfil: `clean` borraria el esquema completo.
spring.flyway.clean-disabled=true

# PROVISIONAL (se elimina en #10): sin un UserDetailsService propio, Spring
# Security crea un usuario en memoria con una password aleatoria y la escribe en
# el log. Los usuarios finales llegan en M4; hasta entonces no queremos esa
# credencial fantasma.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# Documentacion de la API
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# ---------------------------------------------------------------------------
# Integracion con la catedra  (ar.edu.um.turnos.config.CatedraProperties)
# ---------------------------------------------------------------------------
# Todo esto lo entrega la catedra y NO tiene default: si falta, el servicio no
# arranca y el error dice cual falta. Es deliberado — un default inventado para
# una URL o un JWT no sirve para nada y solo esconde el problema hasta la
# primera llamada real.
#
# De donde sale cada valor:
#   - groupId, Redis y Kafka:  GET /api/student/integration   (§5.3)
#   - jwt tecnico:             POST /api/authenticate         (§5.2)
#   - URL base de la API:      la informa la catedra aparte   (§3)
#
# Los topics y el consumer group dependen del groupId, asi que se configuran
# enteros y nunca se arman concatenando en el codigo.
#
# OJO con los dos puntos finales de ${VARIABLE:}. Parecen de mas, siendo que
# estas propiedades justamente NO tienen default, pero son los que hacen que la
# validacion funcione. Sin ellos, cuando la variable de entorno no existe,
# Spring no falla: deja el texto "${CATEDRA_JWT}" como valor literal. Y ese
# literal NO es blanco, asi que @NotBlank lo acepta y el servicio arranca
# convencido de tener una URL cuyo valor es la cadena "${CATEDRA_API_BASE_URL}".
# Con el ":" el valor ausente queda en cadena vacia, @NotBlank dispara y el
# arranque se corta con el mensaje que nombra la variable que falta.
catedra.group-id=${CATEDRA_GROUP_ID:}
catedra.jwt=${CATEDRA_JWT:}
catedra.api.base-url=${CATEDRA_API_BASE_URL:}
catedra.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.consumer-group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID:}
catedra.kafka.appointment-actions-topic=${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC:}
catedra.kafka.appointment-phone-topic=${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC:}

# Redis es OPCIONAL para este servicio: el snapshot del catalogo lo consume el
# otro backend, las ocupaciones y los holds van por REST, y §14.1 es explicito
# en que los holds no tienen acceso contractual por Redis. Queda configurable
# por si se usa el namespace privado alumnos:{groupId}:* para estado auxiliar
# (§14.6). Vacio es un valor valido y no impide arrancar.
catedra.redis.host=${CATEDRA_REDIS_HOST:}
catedra.redis.port=${CATEDRA_REDIS_PORT:6379}
catedra.redis.username=${CATEDRA_REDIS_USERNAME:}
catedra.redis.password=${CATEDRA_REDIS_PASSWORD:}
catedra.redis.read-namespace=${CATEDRA_REDIS_READ_NAMESPACE:}
catedra.redis.write-namespace=${CATEDRA_REDIS_WRITE_NAMESPACE:}

# ---------------------------------------------------------------------------
# JWT que emite ESTE servicio  (ar.edu.um.turnos.config.JwtProperties)
# ---------------------------------------------------------------------------
# Dos secretos DISTINTOS y sin default: uno para el token del usuario final y
# otro para las llamadas internas al servicio de catalogo. Que sean distintos
# es lo que hace criptografica la separacion entre las dos identidades, y hay
# una validacion que rechaza el arranque si se copio el mismo valor en los dos.
#
# Generar cada uno con:  openssl rand -base64 48
turnos.jwt.issuer=${JWT_ISSUER:turnos-reservas-service}
turnos.jwt.user-secret=${JWT_USER_SECRET:}
turnos.jwt.internal-secret=${JWT_INTERNAL_SECRET:}

# Vigencias. El token de usuario dura lo que una sesion de uso; el interno es
# de servicio a servicio y vive apenas lo necesario para la llamada, asi que si
# se filtra de un log sirve mucho menos tiempo. Los valores finos se ajustan en
# los issues que emiten cada token (#10 y #12).
turnos.jwt.user-expiration=${JWT_USER_EXPIRATION:PT1H}
turnos.jwt.internal-expiration=${JWT_INTERNAL_EXPIRATION:PT2M}

# ---------------------------------------------------------------------------
# CORS  (ar.edu.um.turnos.config.CorsProperties)
# ---------------------------------------------------------------------------
# Lista separada por comas de origenes permitidos. Vacio por defecto: sin
# clientes configurados, ningun cross-origin se permite (default seguro).
# Nunca "*" - CorsProperties rechaza el arranque si aparece.
turnos.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
