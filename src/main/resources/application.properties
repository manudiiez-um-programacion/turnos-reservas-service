spring.application.name=turnos-reservas-service

# Se resuelve al compilar: spring-boot-starter-parent filtra este archivo con
# delimitadores @...@, asi que la version del servicio sale del pom y no se duplica.
turnos.version=@project.version@

# 8081 y no 8080: el servicio de catalogo ocupa el 8080 y los dos backends
# tienen que poder correr al mismo tiempo (#5).
server.port=${SERVER_PORT:8081}

# ---------------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------------
# PostgreSQL: el enunciado rechaza H2, SQLite y cualquier embebida como
# almacenamiento principal. Credenciales por variables de entorno; los
# defaults son solo para desarrollo local y no son secretos.
#
# El default apunta al PostgreSQL que publica Docker Compose en la maquina, que
# es el caso de correr la app con `./mvnw spring-boot:run` sin perfil. El
# perfil 'docker' lo sobrescribe, porque dentro de la red de compose la base se
# alcanza por el nombre del servicio y por el puerto interno. Ver
# application-local.properties y application-docker.properties.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:turnos_reservas}}
spring.datasource.username=${DB_USERNAME:turnos}
spring.datasource.password=${DB_PASSWORD:turnos}

# El esquema lo manejan las migraciones versionadas, nunca Hibernate:
# 'validate' solo verifica que el mapeo de las entidades coincida con las
# tablas que crearon los scripts. Nunca 'update' ni 'create-drop', en ningun
# perfil. Mientras no haya entidades JPA, validate no tiene nada que verificar
# y es un no-op; el dia que las haya, avisa si el mapeo y la migracion se
# separaron.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Instantes en UTC del lado de JDBC: el contrato de la catedra usa ISO-8601 en
# UTC y las columnas son TIMESTAMPTZ. Fijarlo evita que el huso de la JVM se
# filtre en lo que se guarda.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# Migraciones (Flyway)
# ---------------------------------------------------------------------------
# Corren solas al arrancar: Flyway aplica lo que falte y registra la version en
# flyway_schema_history, asi que un reinicio no vuelve a aplicar nada. Las
# migraciones se agregan, nunca se editan una vez mergeadas (el checksum deja
# de coincidir y validate-on-migrate falla, que es justamente la proteccion).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# La base arranca vacia: si aparecen tablas sin historial de Flyway es un
# error, y queremos que falle en vez de inventar una linea base.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Nunca, en ningun perfil: `clean` borraria el esquema completo.
spring.flyway.clean-disabled=true

# PROVISIONAL (se elimina en #10): sin un UserDetailsService propio, Spring
# Security crea un usuario en memoria con una password aleatoria y la escribe en
# el log. Los usuarios finales llegan en M4; hasta entonces no queremos esa
# credencial fantasma.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------------------
# Documentacion de la API
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
