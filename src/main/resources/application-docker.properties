# Perfil 'docker': la aplicacion corre DENTRO de Docker Compose.
#
# Sobrescribe la URL de la base por las dos diferencias que impone la red de
# compose: el host es el nombre del servicio ('postgres') y el puerto es el
# interno del contenedor (5432), no el que compose publica en la maquina.
#
# Se ignora DB_URL a proposito: el valor que el .env trae ahi es el de correr
# la app fuera de Docker y apunta a localhost, que dentro del contenedor es el
# contenedor mismo.
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:turnos_reservas}
