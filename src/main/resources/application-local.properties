# Perfil 'local': la aplicacion corre en la maquina y la base en el PostgreSQL
# que publica Docker Compose.
#
#   docker compose up -d postgres
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# No redefine nada: los defaults de application.properties ya son los de este
# caso (localhost y el puerto PUBLICADO por compose, 5433). El perfil existe
# para poder nombrarlo explicitamente y como contraparte simetrica de
# 'docker', que si tiene que sobrescribir la URL.
#
# Para apuntar a otra base sin tocar este archivo: DB_URL en el .env.
