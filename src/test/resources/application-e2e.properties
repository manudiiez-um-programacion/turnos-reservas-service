# Perfil 'e2e' (#41): activado solo por la suite de Testcontainers
# (src/test/java/.../e2e/*IT.java). A diferencia del perfil 'test', aca SI
# hay que correr contra infraestructura real: Flyway queda habilitado
# (hereda application.properties) y el oyente de Kafka, la recuperacion al
# arrancar y el cierre de vencidos arrancan de verdad (tambien por default).
#
# spring.datasource.* no se declara: lo autoconfigura @ServiceConnection
# contra el PostgreSQLContainer de la prueba. catedra.api.base-url,
# catalogo.api.base-url y catedra.kafka.bootstrap-servers tampoco: los pone
# @DynamicPropertySource, porque solo se conocen en tiempo de ejecucion
# (puerto del servidor HTTP simulado, broker de Testcontainers).
#
# El resto son obligatorias sin default (ver application.properties): esta
# suite no necesita secretos de la catedra, asi que son valores inventados,
# igual de invalidos como credenciales que los de application-test.properties.
catedra.group-id=proyecto-e2e
catedra.jwt=jwt-tecnico-de-prueba-no-es-una-credencial
catedra.kafka.consumer-group-id=alumnos-proyecto-e2e
catedra.kafka.appointment-actions-topic=alumnos.turnos.acciones.proyecto-e2e
catedra.kafka.appointment-phone-topic=catedra.turnos.telefono.proyecto-e2e

turnos.jwt.issuer=turnos-reservas-service-e2e
turnos.jwt.user-secret=secreto-de-usuario-solo-para-e2e-00000001
turnos.jwt.internal-secret=secreto-interno-solo-para-e2e-000000002
