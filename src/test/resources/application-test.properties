# Configuracion de las pruebas. Existe para que `./mvnw verify` no necesite
# PostgreSQL levantado.
#
# Es un PERFIL ('test') y no un src/test/resources/application.properties a
# proposito: un archivo con ese nombre no se suma al de main, lo TAPA. Las
# test-classes van antes en el classpath y Spring resuelve
# classpath:/application.properties al primero que encuentra, asi que el de
# produccion no se cargaria y el contexto falla por
# "Could not resolve placeholder 'spring.application.name'". Como perfil, se
# superpone. Lo activan las clases de prueba con @ActiveProfiles("test").
#
# Hasta #5 estas dos propiedades estaban en el application.properties de
# produccion, con una nota de que eran provisionales. Ahora que el compose
# levanta la base, la aplicacion de verdad falla rapido si no puede conectarse
# (que es lo que uno quiere), y la tolerancia queda acotada a las pruebas.
#
# Son dos cosas distintas: Hikari no aborta el arranque si el pool no puede
# crear conexiones, y Hibernate no consulta los metadatos JDBC al iniciar. Sin
# la segunda, el arranque se cuelga ~30 s reintentando conectar.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Consecuencia de la linea de arriba: sin metadatos JDBC, Hibernate no puede
# deducir el dialecto y el arranque falla con "Unable to determine Dialect
# without JDBC metadata". En produccion no hace falta declararlo (y declararlo
# dispara el aviso HHH90000025), asi que vive solo aca.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# URL sintactica: con lo de arriba nunca se abre una conexion real. Las
# pruebas contra una base de verdad llegan con Testcontainers en #41.
spring.datasource.url=jdbc:postgresql://localhost:5433/turnos_reservas_test
spring.datasource.username=turnos
spring.datasource.password=turnos
