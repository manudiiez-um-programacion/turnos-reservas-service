# Verificacion automatica de cada cambio: compila y corre las pruebas.
#
# No necesita ningun secreto de la catedra. La mayoria de las pruebas de este
# repo no hablan con el servicio central ni con PostgreSQL: el servicio esta
# configurado para levantar sin base (ver application.properties) y la
# integracion real se cubre con dobles. La excepcion es la suite de #41
# (src/test/java/.../e2e/*IT.java, perfil Maven 'e2e'), que corre contra
# PostgreSQL y Kafka reales con Testcontainers: tampoco necesita secretos (la
# catedra se simula igual que en el resto de la suite), solo Docker, que los
# runners de ubuntu-latest ya traen.
#
# El check es informativo: el ruleset de las ramas protegidas lo administra la
# catedra y este repo no toca su configuracion, asi que no hay status checks
# obligatorios.
#
# Despues de las pruebas corre el analisis estatico en SonarCloud (#51), con el
# unico secreto que usa este workflow: SONAR_TOKEN, un secret de repositorio que
# provee el dueno del repo. Si no esta, el analisis se omite y el build sigue en
# verde. El quality gate tambien es informativo: no se usa
# `sonar.qualitygate.wait`, asi que un gate rojo no rompe el job.
name: build

on:
  pull_request:
  push:
    branches:
      - develop
      - testing
      - main

permissions:
  contents: read

# Si se pushea de nuevo sobre la misma rama, cancela la corrida anterior.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7
        with:
          # Historial completo: sin esto Sonar no puede calcular el "new code"
          # (que lineas son nuevas respecto de la rama base) y avisa en el log.
          fetch-depth: 0

      - name: Preparar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # Cachea ~/.m2/repository usando el pom.xml como clave.
          cache: maven

      - name: Compilar y correr las pruebas
        run: ./mvnw -B verify

      # Reusa las clases que ya compilo el 'verify' de arriba en el mismo
      # workspace: invoca los goals de Failsafe directo, sin pasar otra vez
      # por todo el ciclo de vida (que volveria a correr Surefire). #41.
      - name: Correr la suite de Testcontainers (PostgreSQL y Kafka reales)
        run: ./mvnw -B -Pe2e failsafe:integration-test failsafe:verify

      # El analisis es opcional a proposito: quien clone el repo sin la cuenta de
      # SonarCloud tiene que poder buildear igual, en verde. Si falta el secret se
      # omite con un aviso en lugar de fallar.
      - name: Ver si hay token de SonarCloud
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Analisis de SonarCloud omitido: falta el secret SONAR_TOKEN."
          fi

      - name: Cachear el analizador de Sonar
        if: steps.sonar.outputs.disponible == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      # Lee el jacoco.xml que dejo el `verify` de arriba (ruta configurada en el
      # pom). El scanner baja su propio Java 21 embebido para correr, asi que no le
      # molesta que el proyecto compile con Java 25.
      - name: Analizar con SonarCloud
        if: steps.sonar.outputs.disponible == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B --no-transfer-progress sonar:sonar

      - name: Publicar el resumen de pruebas y cobertura
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import os
          import xml.etree.ElementTree as ET

          tests = failures = errors = skipped = 0
          clases = []
          reportes = sorted(glob.glob('target/surefire-reports/TEST-*.xml'))
          reportes += sorted(glob.glob('target/failsafe-reports/TEST-*.xml'))
          for f in reportes:
              r = ET.parse(f).getroot()
              t = int(r.get('tests', 0))
              fa = int(r.get('failures', 0))
              er = int(r.get('errors', 0))
              sk = int(r.get('skipped', 0))
              tests += t
              failures += fa
              errors += er
              skipped += sk
              clases.append((r.get('name', '?'), t, fa + er, sk))

          print('## Pruebas\n')
          if not clases:
              print('No se encontraron reportes de pruebas: el build fallo antes de correrlas.\n')
          else:
              estado = 'todas en verde' if failures + errors == 0 else f'{failures + errors} con problemas'
              print(f'**{tests} pruebas, {estado}.**\n')
              print('| Clase | Pruebas | Fallos | Omitidas |')
              print('|---|--:|--:|--:|')
              for nombre, t, bad, sk in clases:
                  print(f'| `{nombre}` | {t} | {bad} | {sk} |')
              print()

          jacoco = 'target/site/jacoco/jacoco.xml'
          if os.path.exists(jacoco):
              root = ET.parse(jacoco).getroot()
              etiquetas = {
                  'LINE': 'Lineas',
                  'BRANCH': 'Ramas',
                  'METHOD': 'Metodos',
                  'CLASS': 'Clases',
              }
              print('## Cobertura\n')
              print('| Metrica | Cubierto | Total | % |')
              print('|---|--:|--:|--:|')
              for c in root.findall('counter'):
                  tipo = c.get('type')
                  if tipo not in etiquetas:
                      continue
                  perdido = int(c.get('missed', 0))
                  cubierto = int(c.get('covered', 0))
                  total = perdido + cubierto
                  pct = f'{100 * cubierto // total}%' if total else 'n/a'
                  print(f'| {etiquetas[tipo]} | {cubierto} | {total} | {pct} |')
              print()
              print('Sin umbral: el enunciado no exige un porcentaje de cobertura.')
              print('El codigo generado por Lombok no cuenta (ver `lombok.config`).')
          PY

      - name: Guardar los reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
