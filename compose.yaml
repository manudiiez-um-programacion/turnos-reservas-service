# Infraestructura local de ESTE servicio: la aplicacion y su PostgreSQL.
#
#   cp .env.example .env     y completar los valores
#   docker compose up --build
#   curl http://localhost:8081/api/health   -> {"estado":"UP",...}
#
# Este compose es para desarrollar el servicio de turnos solo. La solucion
# COMPLETA usa una unica instancia de PostgreSQL con dos bases logicas
# (`catalogo` y `turnos_reservas`), y la levanta un compose de nivel superior
# que vive fuera de los dos repos de servicio. Ver el README.
#
# Redis y Kafka NO se levantan aca: son servicios de la catedra, externos y
# compartidos, y se consumen por red con las credenciales que llegan en el
# login tecnico (§3 de la referencia de integracion).
#
# Puertos: el catalogo usa 8080 (app) y 5432 (postgres). Este servicio usa
# 8081 y 5433 para que los dos puedan correr al mismo tiempo.

name: turnos-reservas-service

services:

  postgres:
    image: postgres:18-alpine
    container_name: turnos-postgres
    restart: unless-stopped
    environment:
      # Cuenta de administracion de la instancia. La aplicacion NO la usa:
      # el script de init crea con ella el rol comun del servicio.
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?falta POSTGRES_SUPERUSER_PASSWORD en .env}
      POSTGRES_DB: postgres
      # Las lee docker/postgres/init/02-crear-base-turnos.sh. Van prefijadas
      # porque en la instancia compartida conviven con las CATALOG_DB_* del
      # otro servicio.
      TURNOS_DB_NAME: ${DB_NAME:-turnos_reservas}
      TURNOS_DB_USERNAME: ${DB_USERNAME:-turnos}
      TURNOS_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    volumes:
      # Volumen nombrado: los datos sobreviven a `down` y a recrear el
      # contenedor. Se borran solo con `down -v`.
      #
      # El punto de montaje es /var/lib/postgresql, no .../data: desde la
      # version 18 la imagen guarda los datos en un subdirectorio por version
      # mayor (.../18/docker) para que un pg_upgrade no cruce el limite del
      # montaje. Montar .../data hace fallar el arranque.
      - postgres-data:/var/lib/postgresql
      # Solo lectura: el contenedor ejecuta el script, no lo modifica.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Publicado para poder inspeccionar la base con un cliente o correr la
      # app desde el IDE. 5433 por defecto para no chocar con el PostgreSQL
      # del catalogo (5432); DB_PORT permite moverlo.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      # -h 127.0.0.1 fuerza TCP a proposito: durante la inicializacion el
      # entrypoint levanta un servidor temporal que escucha SOLO en el socket
      # unix. Chequear por socket daria "sano" antes de que corra el script
      # de init, y la app arrancaria contra una base que todavia no existe.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  turnos-reservas:
    build:
      context: .
      dockerfile: Dockerfile
    image: turnos-reservas-service:local
    container_name: turnos-reservas
    restart: unless-stopped
    depends_on:
      postgres:
        # Arranca recien cuando el healthcheck de arriba pasa. Hace falta
        # porque la app ya no tolera arrancar sin base: falla rapido.
        condition: service_healthy
    environment:
      # Perfil 'docker': la base se alcanza por el nombre del servicio en la
      # red de compose. El perfil 'local' apunta a localhost.
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081

      # Dentro de la red de compose el host es el nombre del servicio, no
      # localhost, y el puerto es el interno (5432), no el publicado. Por eso
      # estas tres se arman aca y no se toman crudas de .env: el DB_URL de
      # .env es el de correr la app fuera de Docker.
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-turnos_reservas}
      DB_USERNAME: ${DB_USERNAME:-turnos}
      DB_PASSWORD: ${DB_PASSWORD}

      # Integracion con la catedra. Los valores viven en .env, que no se
      # versiona, y se pasan CRUDOS, sin `:?`.
      #
      # Tentaba poner `:?` para que compose se quejara antes de construir, pero
      # su interpolacion valida el archivo ENTERO: con `:?` aca,
      # `docker compose up -d postgres` --el flujo del README para iterar desde
      # el IDE-- exigiria la configuracion de la aplicacion para levantar solo
      # la base. Ademas duplicaria la validacion en dos capas.
      #
      # Quien valida es la aplicacion, que es su dueña y da mejor diagnostico:
      # dice exactamente que propiedad falta y por que. Si falta algo, el
      # contenedor arranca y el servicio muere en el acto con ese mensaje.
      CATEDRA_API_BASE_URL: ${CATEDRA_API_BASE_URL}
      CATEDRA_JWT: ${CATEDRA_JWT}
      CATEDRA_GROUP_ID: ${CATEDRA_GROUP_ID}
      CATEDRA_KAFKA_BOOTSTRAP_SERVERS: ${CATEDRA_KAFKA_BOOTSTRAP_SERVERS}
      CATEDRA_KAFKA_CONSUMER_GROUP_ID: ${CATEDRA_KAFKA_CONSUMER_GROUP_ID}
      CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC: ${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC}
      CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC: ${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC}

      # Redis es opcional para este servicio (ver .env.example): si no se usa,
      # queda vacio y el servicio arranca igual.
      CATEDRA_REDIS_HOST: ${CATEDRA_REDIS_HOST:-}
      CATEDRA_REDIS_PORT: ${CATEDRA_REDIS_PORT:-6379}
      CATEDRA_REDIS_USERNAME: ${CATEDRA_REDIS_USERNAME:-}
      CATEDRA_REDIS_PASSWORD: ${CATEDRA_REDIS_PASSWORD:-}
      CATEDRA_REDIS_READ_NAMESPACE: ${CATEDRA_REDIS_READ_NAMESPACE:-}
      CATEDRA_REDIS_WRITE_NAMESPACE: ${CATEDRA_REDIS_WRITE_NAMESPACE:-}

      # Secretos de los JWT que emite este servicio. Obligatorios y distintos
      # entre si: la validacion de la aplicacion rechaza el arranque si falta
      # alguno o si coinciden.
      JWT_USER_SECRET: ${JWT_USER_SECRET}
      JWT_INTERNAL_SECRET: ${JWT_INTERNAL_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-turnos-reservas-service}
      JWT_USER_EXPIRATION: ${JWT_USER_EXPIRATION:-PT1H}
      JWT_INTERNAL_EXPIRATION: ${JWT_INTERNAL_EXPIRATION:-PT2M}

      # CORS (#11): vacio por defecto, ningun cross-origin permitido.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${SERVER_PORT:-8081}:8081"
    healthcheck:
      # wget viene en busybox, que la imagen alpine ya trae: no hace falta
      # instalar nada en la imagen final solo para chequear salud.
      #
      # OJO: /api/health responde por liveness, no verifica la base. Alcanza
      # para saber que el proceso atiende HTTP, que es lo que compose
      # necesita. Un health real con estado de dependencias llega en #40.
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/api/health | grep -q '\"estado\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  postgres-data:
    name: turnos-reservas-service-postgres-data
